name: ARKlinux Native GPU Contract

on:
  pull_request:
    paths:
      - 'restart/native-ark-v0.1/**'
      - '.github/workflows/native-gpu-contract.yml'
  push:
    branches:
      - 'release/native-ark-v0.1'
      - 'fix/pascal-gpu-driver'
    paths:
      - 'restart/native-ark-v0.1/**'
      - '.github/workflows/native-gpu-contract.yml'

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate shell entry points
        run: |
          bash -n \
            restart/native-ark-v0.1/rootfs/usr/local/sbin/ark-gpu-install \
            restart/native-ark-v0.1/rootfs/usr/local/sbin/ark-display-preflight \
            restart/native-ark-v0.1/rootfs/usr/local/bin/ark-bootstrap-ai \
            restart/native-ark-v0.1/build/build-image.sh \
            restart/native-ark-v0.1/tools/ark-repair-installed-display
          shellcheck -S warning \
            restart/native-ark-v0.1/rootfs/usr/local/sbin/ark-gpu-install \
            restart/native-ark-v0.1/rootfs/usr/local/sbin/ark-display-preflight \
            restart/native-ark-v0.1/rootfs/usr/local/bin/ark-bootstrap-ai \
            restart/native-ark-v0.1/tools/ark-repair-installed-display
      - name: Run GPU detection tests
        run: python -m unittest discover -s restart/native-ark-v0.1/tests -v
      - name: Validate immutable Pascal source lock
        run: |
          LOCK=restart/native-ark-v0.1/rootfs/usr/lib/ark-gpu/nvidia-pascal.lock
          grep -q '^NVIDIA_PASCAL_DRIVER_VERSION=580\.178\.04$' "$LOCK"
          grep -Eq '^NVIDIA_PASCAL_AUR_COMMIT=[0-9a-f]{40}$' "$LOCK"
          grep -Eq '^NVIDIA_PASCAL_RUNFILE_SHA256=[0-9a-f]{64}$' "$LOCK"
          grep -q '10de:1d01' "$LOCK"
          grep -q '10de:1c31' "$LOCK"
          grep -q '^NVIDIA_PASCAL_TORCH_VERSION=2\.7\.1$' "$LOCK"
          grep -q '^NVIDIA_PASCAL_TORCH_INDEX=https://download\.pytorch\.org/whl/cu126$' "$LOCK"
      - name: Validate portable native display contract
        run: |
          PKGS=restart/native-ark-v0.1/config/packages.x86_64
          grep -qx 'linux-lts' "$PKGS"
          grep -qx 'linux-lts-headers' "$PKGS"
          ! grep -qx 'linux' "$PKGS"
          ! grep -qx 'linux-headers' "$PKGS"
          grep -q 'INITRAMFS_FALLBACK' restart/native-ark-v0.1/build/build-image.sh
          ! grep -q '^service[[:space:]]*=' restart/native-ark-v0.1/rootfs/etc/greetd/config.toml
          grep -q 'pam_env.so conffile=/etc/greetd/greetd-pam-env.conf' restart/native-ark-v0.1/rootfs/etc/pam.d/greetd
          grep -q 'Requires=ark-display-preflight.service' restart/native-ark-v0.1/rootfs/etc/systemd/system/greetd.service.d/10-arklinux-vt.conf
          grep -q '^OnFailure=getty@tty1.service$' restart/native-ark-v0.1/rootfs/etc/systemd/system/ark-display-preflight.service
