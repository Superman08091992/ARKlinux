name: ARKlinux Desktop Runtime Contract

on:
  pull_request:
    paths:
      - 'system/full-construction/**'
      - '.github/workflows/desktop-runtime-contract.yml'
  push:
    branches:
      - 'desktop/ark-native-v0.1'
    paths:
      - 'system/full-construction/**'
      - '.github/workflows/desktop-runtime-contract.yml'

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile desktop Python
        run: |
          python -m py_compile \
            system/full-construction/rootfs/usr/lib/ark-desktop/ark-desktop.py \
            system/full-construction/rootfs/usr/lib/ark-desktop/ark-rootd.py \
            system/full-construction/rootfs/usr/lib/ark-desktop/ark-shell.py \
            system/full-construction/rootfs/usr/lib/ark-desktop/ark-agentctl.py
      - name: Run full-construction tests
        run: python -m pytest -q system/full-construction/tests
      - name: Verify desktop contract
        run: bash system/full-construction/scripts/verify-desktop.sh
      - name: Verify topology contract
        run: bash system/full-construction/scripts/verify-topology.sh
      - name: Verify private runtime lock and reject active legacy contracts
        run: |
          LOCK=system/full-construction/config/ark-genesis.lock
          test -s "$LOCK"
          grep -Eq '^ARK_GENESIS_COMMIT=[0-9a-f]{40}$' "$LOCK"
          grep -q '^ARK_RUNTIME_ROOT=/opt/ark$' "$LOCK"
          grep -q '^ARK_GENESIS_REPOSITORY=Superman08091992/ARK_GENESIS$' "$LOCK"
          grep -q '^ARK_GENESIS_PACKAGES="ark-runtime ark-services ark-ui"$' "$LOCK"
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('system/full-construction/config'),
              Path('system/full-construction/rootfs/etc/systemd'),
              Path('system/full-construction/rootfs/usr/lib/ark-desktop'),
          ]
          # `/opt/ark/...` is canonical and must not be mistaken for legacy `/ark/...`.
          legacy = re.compile(r'(?<!/opt)/ark/(?:processes|runtime)|ark-(?:kyle|joey|hrm|kenny)\.service')
          violations = []
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix == '.md':
                      continue
                  try:
                      lines = path.read_text(encoding='utf-8').splitlines()
                  except UnicodeDecodeError:
                      continue
                  for number, line in enumerate(lines, 1):
                      if line.lstrip().startswith('#'):
                          continue
                      if legacy.search(line):
                          violations.append(f'{path}:{number}:{line.strip()}')
          if violations:
              raise SystemExit('Active legacy/fake-agent contract found:\n' + '\n'.join(violations))
          PY
