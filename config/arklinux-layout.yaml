root_subvolume: '@ark'
facet_subvolumes:
  existence: '@existence'
  location: '@location'
  ownership: '@ownership'
  purpose: '@purpose'
  startup: '@startup'
  access: '@access'
  dependencies: '@dependencies'
  state: '@state'
  changes: '@changes'
  authority: '@authority'
  stop: '@stop'
  restore: '@restore'
