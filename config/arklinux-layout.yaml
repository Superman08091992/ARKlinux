schema_version: 2.0.0
canonical_root: /ark
root_subvolume: '@ark'
facet_subvolumes:
  existence: '@existence'
  location: '@location'
  ownership: '@ownership'
  purpose: '@purpose'
  startup: '@startup'
  access: '@access'
  dependencies: '@dependencies'
  state: '@state'
  changes: '@changes'
  authority: '@authority'
  stop: '@stop'
  restore: '@restore'
kernel:
  canonical_name: ARKlinux kernel
  esp_artifact: /EFI/arklinux/arklinux-kernel
  initramfs_artifact: /EFI/arklinux/arklinux-initramfs.img
  upstream_compatible_sources:
    - /boot/vmlinuz-linux-ark
    - /boot/vmlinuz-linux
portable_runtime:
  linux_root: /ark
  wsl2_root: /ark
  windows_root: '%ProgramData%\ARK'
compatibility:
  legacy_root_aliases: false
