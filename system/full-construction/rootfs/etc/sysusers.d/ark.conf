# native process identities
u arkd -:ark-core "A.R.K. process coordinator" /var/empty /usr/bin/nologin
u ark-bus -:ark-ipc "A.R.K. local bus" /var/empty /usr/bin/nologin
u ark-watchdog -:ark-watchdog "A.R.K. watchdog" /var/empty /usr/bin/nologin
u ark-kyle -:ark-lifecycle "A.R.K. lifecycle process" /var/empty /usr/bin/nologin
u ark-joey -:ark-cognition "A.R.K. cognition process carrier" /var/empty /usr/bin/nologin
u ark-hrm -:ark-correspondence "A.R.K. correspondence process" /var/empty /usr/bin/nologin
u ark-kenny -:ark-effect "A.R.K. effect process" /var/empty /usr/bin/nologin
u ark-ingest -:ark-ingest "A.R.K. ingestion process" /var/empty /usr/bin/nologin
u ark-model-router -:ark-model "A.R.K. model routing process" /var/empty /usr/bin/nologin
u ark-hardwared -:ark-io "A.R.K. hardware path process" /var/empty /usr/bin/nologin

# local bus access
m arkd ark-ipc
m ark-watchdog ark-ipc
m ark-kyle ark-ipc
m ark-joey ark-ipc
m ark-hrm ark-ipc
m ark-kenny ark-ipc
m ark-ingest ark-ipc
m ark-model-router ark-ipc
m ark-hardwared ark-ipc
