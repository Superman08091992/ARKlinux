[Unit]
Requires=ark-layout.service
After=ark-layout.service

[Service]
Environment=ARK_STATE_ROOT=/ark
ReadOnlyPaths=
ReadOnlyPaths=/ark/models /ark/aletheia /ark/existence /ark/location /ark/ownership /ark/purpose /ark/startup /ark/access /ark/dependencies /ark/authority
ReadWritePaths=
ReadWritePaths=/ark/logs /ark/run /ark/memory /ark/bus /ark/state /ark/changes
InaccessiblePaths=
InaccessiblePaths=/ark/secrets /ark/quarantine
